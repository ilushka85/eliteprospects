<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" fill="none">
  <!-- Shield / Crest shape -->
  <path d="M26 10 L26 46 C26 58 36 66 40 68 L40 68 C44 66 54 58 54 46 L54 10 Z"
        fill="#0a1525" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Puck inside shield -->
  <ellipse cx="40" cy="36" rx="9" ry="5.5" fill="#0ea5e9" opacity="0.9"/>
  <ellipse cx="40" cy="34.5" rx="9" ry="5.5" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
  <!-- Stick line across puck -->
  <line x1="31" y1="34.5" x2="49" y2="34.5" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Star / accent on shield top -->
  <path d="M40 14 L41.5 18.5 L46 18.5 L42.5 21.5 L43.8 26 L40 23 L36.2 26 L37.5 21.5 L34 18.5 L38.5 18.5 Z"
        fill="#f59e0b" opacity="0.9"/>

  <!-- ELITE PROSPECTS text -->
  <text x="68" y="33" font-family="Oswald, Impact, sans-serif" font-size="20" font-weight="700"
        fill="#ffffff" letter-spacing="2">ELITE PROSPECTS</text>

  <!-- Divider line -->
  <line x1="68" y1="40" x2="210" y2="40" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>

  <!-- HOCKEY text -->
  <text x="68" y="58" font-family="Oswald, Impact, sans-serif" font-size="16" font-weight="600"
        fill="#0ea5e9" letter-spacing="8">HOCKEY</text>
</svg>
